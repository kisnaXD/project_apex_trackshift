services:
  apex_2d:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex2d_decision_engine
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - PYTHONPATH=/app
    command: ["streamlit", "run", "streamlit_app/app.py"]
    restart: unless-stopped
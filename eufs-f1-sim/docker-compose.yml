services:
  eufs-f1-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: eufs-f1-sim:lean
    container_name: eufs-f1-sim
    cpus: 4
    mem_limit: 8g
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - EUFS_MASTER=/opt/eufs_ws
      - ROS_LOCALHOST_ONLY=1
      - GAZEBO_IP=127.0.0.1
      - GAZEBO_MASTER_URI=http://127.0.0.1:11345
      - "TRACK=${TRACK:-cota}"
      - "CARS=${CARS:-1}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
    init: true
    command:
      - ros2
      - run
      - eufs_racecar
      - start_dashboard
      - --ros-args
      - -p
      - manage_stack:=true

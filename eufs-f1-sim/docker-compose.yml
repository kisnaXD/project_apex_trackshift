services:
  eufs-f1-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: eufs-f1-sim:lean
    container_name: eufs-f1-sim
    cpus: 4
    mem_limit: 8g
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - EUFS_MASTER=/opt/eufs_ws
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
    command:
      - ros2
      - launch
      - eufs_racecar
      - load_car.launch.py
      - gazebo_gui:=false
      - show_rqt_gui:=false
      - rviz:=false
      - "track:=${TRACK:-cota}"
      - "cars:=${CARS:-1}"
